[package]
name = "poe2_comparator_api"
version = "0.1.0"
edition = "2024"

[dependencies]
poe2_comparator_core = { path = "../poe2_comparator_core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
