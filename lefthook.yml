colors: true
output:
  - summary
  - execution
  - failure

pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --check --all

    rust-clippy:
      glob: "*.rs"
      run: cargo clippy -- -D warnings

    frontend-lint:
      glob: "*.{js,ts,jsx,tsx,vue,svelte}"
      run: npm --prefix frontend run check

    frontend-format:
      glob: "*.{js,ts,json,md,css}"
      run: npm --prefix frontend exec prettier -- --write {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    rust-tests:
      run: cargo test